name: Stage 01-12 local checks (provider and deployment acceptance separate)
on: [push, pull_request]
permissions:
  contents: read

jobs:
  operations:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -u scripts/run_stage12_checks.py
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r backend/requirements-test.lock
      - run: ruff check backend scripts --target-version py312
      - run: python -m unittest discover -s scripts -p "test_*.py"
      - run: pytest -m "not integration"
        working-directory: backend
      - run: pip-audit -r backend/requirements.lock
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "24"}
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm lint && pnpm typecheck && pnpm test && pnpm build
        working-directory: frontend
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: frontend
      - run: pnpm test:e2e
        working-directory: frontend
      - run: pnpm audit --prod
        working-directory: frontend
  auth-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "24"}
      - run: npm install --global pnpm@11.25.0
      - run: docker compose -f compose.e2e.yaml up --build -d --wait --wait-timeout 180
      - run: pnpm install --frozen-lockfile && pnpm build && pnpm exec playwright install --with-deps chromium
        working-directory: frontend
      - run: pnpm test:e2e
        working-directory: frontend
        env: {E2E_AUTH: "1"}
      - name: Cleanup browser test services
        if: always()
        run: docker compose -f compose.e2e.yaml down -v
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f compose.test.yaml up --build --abort-on-container-exit --exit-code-from tests
      - name: Cleanup isolated test project
        if: always()
        run: docker compose -f compose.test.yaml down -v
      - run: python scripts/init_env.py
      - run: docker compose up --build -d --wait --wait-timeout 180
      - run: python scripts/smoke.py
      - name: Cleanup development smoke project
        if: always()
        run: docker compose down
