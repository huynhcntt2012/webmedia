# Real auth backend for browser tests, independent of all development volumes.
name: suni-auth-e2e
x-env: &env
  APP_ENV: test
  APP_SECRET: e2e-only-0123456789abcdef0123456789abcdef0123456789abcdef
  DATABASE_URL: postgresql+psycopg://suni_runtime:e2e-runtime-0123456789abcdef0123456789@postgres:5432/suni_test
  REDIS_URL: redis://:e2e-only-password@redis:6379/0
  PUBLIC_ORIGIN: http://localhost:3100
  ALLOWED_HOSTS: localhost,127.0.0.1,api
  POSTER_ALLOWED_HOSTS: media.sunifactory.com
  AUTH_IP_LIMIT: "5000"
  AUTH_ACCOUNT_LIMIT: "5000"
  PAYMENT_MODE: sandbox
  SEPAY_WEBHOOK_SECRET: e2e-only-webhook-0123456789abcdef0123456789abcdef
  SEPAY_BANK: TestBank
  SEPAY_ACCOUNT: TEST123456
x-app: &app
  init: true
  build: {context: ./backend, target: base}
  environment: *env
  networks: [isolated]
services:
  postgres:
    image: postgres:17-bookworm
    command: [postgres, -c, log_error_verbosity=terse, -c, log_min_error_statement=panic, -c, log_parameter_max_length_on_error=0, -c, log_statement=none]
    environment: {POSTGRES_USER: suni, POSTGRES_PASSWORD: e2e-only-password, POSTGRES_DB: suni_test}
    tmpfs: [/var/lib/postgresql/data]
    networks: [isolated]
    healthcheck:
      test: [CMD, pg_isready, -U, suni, -d, suni_test]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7.4-bookworm
    command: [redis-server, --requirepass, e2e-only-password]
    networks: [isolated]
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH=e2e-only-password redis-cli ping | grep -q PONG']
      interval: 2s
      timeout: 3s
      retries: 30
  db-bootstrap:
    <<: *app
    command: [python, -m, app.bootstrap_db]
    environment:
      BOOTSTRAP_DATABASE_URL: postgresql+psycopg://suni:e2e-only-password@postgres:5432/suni_test
      MIGRATOR_PASSWORD: e2e-migrator-0123456789abcdef0123456789
      RUNTIME_PASSWORD: e2e-runtime-0123456789abcdef0123456789
    depends_on:
      postgres: {condition: service_healthy}
  migrate:
    <<: *app
    command: [sh, -c, "python -m app.migrate && python -m app.e2e_catalogue_seed"]
    environment:
      <<: *env
      DATABASE_URL: postgresql+psycopg://suni_migrator:e2e-migrator-0123456789abcdef0123456789@postgres:5432/suni_test
    depends_on:
      db-bootstrap: {condition: service_completed_successfully}
  api:
    <<: *app
    volumes: [test_media:/var/lib/suni-media]
    networks: [isolated, edge]
    ports: [127.0.0.1:18000:8000]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=5)"]
      interval: 3s
      timeout: 6s
      retries: 20
  worker:
    <<: *app
    volumes: [test_media:/var/lib/suni-media]
    mem_limit: 2g
    pids_limit: 128
    command: [celery, -A, app.worker.celery_app, worker, --loglevel=WARNING, --concurrency=1]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
  beat:
    <<: *app
    command: [celery, -A, app.worker.celery_app, beat, --loglevel=WARNING, --schedule=/tmp/celerybeat-schedule]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
networks:
  isolated: {internal: true}
  edge:

volumes:
  test_media:
