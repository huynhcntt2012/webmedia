[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "suni-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic-settings>=2.8,<3",
  "sqlalchemy>=2.0.39,<2.1",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.15,<2",
  "redis>=5.2,<7",
  "celery[redis]>=5.4,<6",
  "pwdlib[argon2]>=0.3,<1",
  "PyJWT>=2.10,<3",
  "email-validator>=2.2,<3",
  "Pillow>=12,<14",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<9", "httpx>=0.28,<1", "ruff>=0.11,<1", "pip-audit>=2.9,<3"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: requires isolated PostgreSQL, Redis, worker and FFmpeg"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
